name: Add Packages Final

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show current HTML nav
        run: |
          echo "==== Current nav items ===="
          grep -n 'data-page' docs/index.html || echo "none"
          echo ""
          echo "==== Current PAGES in JS ===="
          grep -n "var PAGES" docs/app.js || echo "none"

      - name: Patch HTML - add Packages nav
        run: |
          python3 << 'ENDPY'
          with open('docs/index.html') as f:
              c = f.read()

          if 'data-page="packages"' in c:
              print("✓ Packages nav already exists")
          else:
              # Find "notices" nav - simplest possible approach
              idx = c.find('data-page="notices"')
              if idx == -1:
                  print("ERROR: notices button not found")
                  exit(1)

              # Find the closing </button> after notices
              end_idx = c.find('</button>', idx)
              if end_idx == -1:
                  print("ERROR: closing button not found")
                  exit(1)
              end_idx += len('</button>')

              # Insert new button
              new_btn = '\n        <button type="button" class="nav-item" data-page="packages">\n          <span class="nav-icon">&#128230;</span><span>Packages</span>\n        </button>'

              c = c[:end_idx] + new_btn + c[end_idx:]

              with open('docs/index.html', 'w') as f:
                  f.write(c)
              print("✓ Packages nav added")

          # Verify
          with open('docs/index.html') as f:
              check = f.read()
          if 'data-page="packages"' in check:
              print("✓ VERIFIED: packages nav exists")
          else:
              print("ERROR: verification failed")
              exit(1)
          ENDPY

      - name: Patch JS - add Packages to PAGES
        run: |
          python3 << 'ENDPY'
          with open('docs/app.js') as f:
              c = f.read()

          if 'renderPackages' in c:
              print("✓ renderPackages already exists")
          else:
              # Find "var PAGES = {" and the closing of the object
              idx = c.find('var PAGES = {')
              if idx == -1:
                  print("ERROR: PAGES not found")
                  exit(1)

              # Find the closing }; - search for the pattern after "notices"
              search_start = c.find('notices:', idx)
              if search_start == -1:
                  print("ERROR: notices entry not found")
                  exit(1)

              # Find the closing of the PAGES object
              close_idx = c.find('};', search_start)
              if close_idx == -1:
                  print("ERROR: PAGES close not found")
                  exit(1)

              # Insert packages entry before the closing
              new_entry = ",\n            packages:  {title: 'Packages', render: renderPackages}\n          "
              c = c[:close_idx] + new_entry + c[close_idx:]

              print("✓ Packages added to PAGES")

          with open('docs/app.js', 'w') as f:
              f.write(c)
          ENDPY

      - name: Patch JS - add packages snapshot listener
        run: |
          python3 << 'ENDPY'
          with open('docs/app.js') as f:
              c = f.read()

          if "db.collection('packages').onSnapshot" in c:
              print("✓ packages listener already exists")
              exit(0)

          # Find the notices listener
          idx = c.find("db.collection('notices').onSnapshot")
          if idx == -1:
              print("⚠ notices listener not found (non-critical)")
              exit(0)

          # Find the end of this listener statement (next `));` or `);`)
          end_idx = c.find('));', idx)
          if end_idx == -1:
              print("⚠ could not find end of listener (non-critical)")
              exit(0)
          end_idx += 3

          # Insert new listener after
          new_listener = "\n            unsubs.push(db.collection('packages').onSnapshot(function(){\n              if(currentPage==='packages')renderPackages();\n            },function(e){console.error(e)}));"

          c = c[:end_idx] + new_listener + c[end_idx:]

          with open('docs/app.js', 'w') as f:
              f.write(c)
          print("✓ packages listener added")
          ENDPY

      - name: Append packages code to app.js
        run: |
          python3 << 'ENDPY'
          with open('docs/app.js') as f:
              c = f.read()

          if 'function renderPackages' in c:
              print("✓ renderPackages function already exists")
              exit(0)

          packages_code = """

// ============ PACKAGES ============
var pkgCache = [];

function renderPackages(){
  var body = $('#pageBody');
  body.innerHTML = '<div class="empty">Loading packages...</div>';
  db.collection('packages').get()
    .then(function(snap){
      pkgCache = snap.docs.map(function(d){
        var o = {id: d.id};
        var x = d.data();
        for (var k in x) o[k] = x[k];
        return o;
      });
      pkgCache.sort(function(a,b){return (a.order||0) - (b.order||0);});
      paintPackages();
    })
    .catch(function(e){
      console.error('packages load failed:', e);
      body.innerHTML = '<div class="empty">Failed to load packages</div>';
    });
}

function paintPackages(){
  var body = $('#pageBody');
  body.innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px">'+
      '<div>'+
        '<div style="font-size:16px;font-weight:700">Manage Packages</div>'+
        '<div style="font-size:12.5px;color:var(--grey);margin-top:2px">Changes here appear instantly in the customer app</div>'+
      '</div>'+
      '<button id="addPkgBtn" class="btn btn-primary" type="button">+ New Package</button>'+
    '</div>'+
    '<div id="pkgList"></div>';

  var list = $('#pkgList');
  if (pkgCache.length === 0){
    list.innerHTML = '<div class="empty">No packages yet. Tap "New Package" to add.</div>';
  } else {
    list.innerHTML = pkgCache.map(function(p){
      var active = p.isActive !== false;
      return '<div class="card" style="display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:10px;flex-wrap:wrap">'+
        '<div class="stat-icon stat-info" style="width:48px;height:48px;font-size:22px;flex-shrink:0">&#128225;</div>'+
        '<div style="flex:1;min-width:120px">'+
          '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
            '<div style="font-size:16px;font-weight:700">'+esc(p.name||'')+'</div>'+
            (active ? '' : '<span class="pill pill-info">INACTIVE</span>')+
          '</div>'+
          '<div style="font-family:Poppins;font-size:14px;font-weight:700;color:var(--primary);margin-top:2px">৳'+(p.price||0)+' per month</div>'+
        '</div>'+
        '<button class="btn btn-outline pkg-edit" data-id="'+p.id+'" type="button" style="padding:8px 14px;font-size:13px">Edit</button>'+
        '<button class="btn btn-danger pkg-del" data-id="'+p.id+'" data-name="'+esc(p.name||'')+'" type="button" style="padding:8px 14px;font-size:13px">Delete</button>'+
      '</div>';
    }).join('');
  }

  $('#addPkgBtn').onclick = function(){ openAddPackage(null); };
  $$('.pkg-edit').forEach(function(b){
    b.onclick = function(){
      var id = b.dataset.id;
      var p = pkgCache.filter(function(x){return x.id===id})[0];
      if (p) openAddPackage(p);
    };
  });
  $$('.pkg-del').forEach(function(b){
    b.onclick = function(){
      var id = b.dataset.id;
      var name = b.dataset.name;
      if (!confirm('Delete package "'+name+'"?')) return;
      db.collection('packages').doc(id).delete()
        .then(function(){
          toast('Package deleted', 'success');
          renderPackages();
        })
        .catch(function(e){
          console.error(e);
          toast('Delete failed', 'error');
        });
    };
  });
}

function openAddPackage(existing){
  var isEdit = existing !== null && existing !== undefined;
  var name = isEdit ? (existing.name||'') : '';
  var price = isEdit ? (existing.price||525) : 525;
  var order = isEdit ? (existing.order||1) : (pkgCache.length + 1);
  var active = isEdit ? (existing.isActive !== false) : true;

  openModal(
    '<div class="modal-title">'+(isEdit?'Edit Package':'New Package')+'</div>'+
    '<div class="form-row"><label>Speed (e.g. 20 Mbps)</label><input id="pkgName" value="'+esc(name)+'" placeholder="20 Mbps"></div>'+
    '<div class="form-row"><label>Monthly Price (৳)</label><input id="pkgPrice" type="number" value="'+price+'"></div>'+
    '<div class="form-row"><label>Display Order</label><input id="pkgOrder" type="number" value="'+order+'"></div>'+
    '<div class="form-row"><label style="display:flex;align-items:center;gap:8px;cursor:pointer">'+
      '<input type="checkbox" id="pkgActive" '+(active?'checked':'')+' style="width:auto"> Active (visible to customers)'+
    '</label></div>'+
    '<div class="modal-actions">'+
      '<button class="btn btn-outline" id="pkgCancel" type="button">Cancel</button>'+
      '<button class="btn btn-primary" id="pkgSave" type="button">'+(isEdit?'Save':'Add')+'</button>'+
    '</div>'
  );

  $('#pkgCancel').onclick = closeModal;
  $('#pkgSave').onclick = function(){
    var n = $('#pkgName').value.trim();
    if (!n) return toast('Enter speed name','error');
    var data = {
      name: n,
      price: Number($('#pkgPrice').value) || 0,
      order: Number($('#pkgOrder').value) || 1,
      isActive: $('#pkgActive').checked
    };
    var btn = $('#pkgSave');
    btn.disabled = true;
    btn.textContent = 'Saving...';
    var promise = isEdit
      ? db.collection('packages').doc(existing.id).update(data)
      : db.collection('packages').add(Object.assign({}, data, {createdAt: firebase.firestore.FieldValue.serverTimestamp()}));

    promise.then(function(){
      closeModal();
      toast(isEdit ? 'Package updated' : 'Package added', 'success');
      renderPackages();
    }).catch(function(e){
      console.error(e);
      toast('Save failed: '+e.message, 'error');
      btn.disabled = false;
      btn.textContent = isEdit ? 'Save' : 'Add';
    });
  };
}
"""

          c = c + packages_code

          with open('docs/app.js', 'w') as f:
              f.write(c)
          print("✓ renderPackages code appended")

          # Verify
          with open('docs/app.js') as f:
              check = f.read()
          print("renderPackages count:", check.count('renderPackages'))
          print("openAddPackage count:", check.count('openAddPackage'))
          ENDPY

      - name: Final verify
        run: |
          echo ""
          echo "========== HTML Nav =========="
          grep -o 'data-page="[^"]*"' docs/index.html || true
          echo ""
          echo "========== JS PAGES =========="
          grep -A 8 "var PAGES" docs/app.js | head -10
          echo ""
          echo "========== JS Function Check =========="
          grep -c "function renderPackages" docs/app.js
          grep -c "function openAddPackage" docs/app.js

      - name: Commit
        run: |
          git config user.name "JAJ Net Bot"
          git config user.email "bot@jajnet.local"
          git add docs/
          git commit -m "Add Packages management (final)" || echo "nothing to commit"
          git push
