name: Setup JAJ Net Admin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create web scaffold
        run: |
          cd /tmp
          flutter create --project-name jajnet_admin --platforms web fresh_admin
          cp -r /tmp/fresh_admin/web $GITHUB_WORKSPACE/web

      - name: Write pubspec.yaml
        run: |
          cat > pubspec.yaml << 'ENDX'
          name: jajnet_admin
          description: JAJ Net Admin Panel
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.3.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            firebase_core: ^2.32.0
            firebase_auth: ^4.20.0
            cloud_firestore: ^4.17.5
            google_fonts: ^6.1.0
            intl: ^0.19.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          ENDX

      - name: Write lib/theme.dart
        run: |
          mkdir -p lib/pages
          cat > lib/theme.dart << 'ENDX'
          import 'package:flutter/material.dart';
          import 'package:google_fonts/google_fonts.dart';

          class AC {
            static const Color primary = Color(0xFFFF6B00);
            static const Color primaryDark = Color(0xFFE55A00);
            static const Color primaryLight = Color(0xFFFF9F5A);
            static const Color cream = Color(0xFFFFF6EE);
            static const Color creamDeep = Color(0xFFFFEBD8);
            static const Color white = Color(0xFFFFFFFF);
            static const Color ink = Color(0xFF151A26);
            static const Color grey = Color(0xFF8A92A0);
            static const Color greyLight = Color(0xFFE8EAEE);
            static const Color greyBg = Color(0xFFF5F6F8);
            static const Color success = Color(0xFF00B87C);
            static const Color warning = Color(0xFFFFA000);
            static const Color error = Color(0xFFFF4757);
            static const Color info = Color(0xFF2E7DFF);
            static const Color sidebarBg = Color(0xFF1A1F2E);
            static const Color sidebarHover = Color(0xFF252B3D);

            static const LinearGradient heroGradient = LinearGradient(
              colors: [Color(0xFFFF9F5A), Color(0xFFFF6B00), Color(0xFFE55A00)],
              begin: Alignment.topLeft,
              end: Alignment.bottomRight,
            );

            static List<BoxShadow> cardShadow = [
              BoxShadow(
                color: Color(0xFF151A26).withOpacity(0.06),
                blurRadius: 14,
                offset: const Offset(0, 4),
              ),
            ];
          }

          ThemeData buildAdminTheme() {
            final base = ThemeData(
              useMaterial3: true,
              scaffoldBackgroundColor: AC.greyBg,
              colorScheme: ColorScheme.fromSeed(
                seedColor: AC.primary,
                brightness: Brightness.light,
                primary: AC.primary,
              ),
            );
            return base.copyWith(
              textTheme: GoogleFonts.hindSiliguriTextTheme(base.textTheme),
              appBarTheme: AppBarTheme(
                backgroundColor: AC.white,
                elevation: 0,
                scrolledUnderElevation: 0,
                foregroundColor: AC.ink,
                titleTextStyle: GoogleFonts.hindSiliguri(
                  color: AC.ink,
                  fontSize: 18,
                  fontWeight: FontWeight.w600,
                ),
              ),
              inputDecorationTheme: InputDecorationTheme(
                filled: true,
                fillColor: AC.cream,
                contentPadding:
                    const EdgeInsets.symmetric(horizontal: 16, vertical: 16),
                border: OutlineInputBorder(
                  borderRadius: BorderRadius.circular(14),
                  borderSide: BorderSide.none,
                ),
                enabledBorder: OutlineInputBorder(
                  borderRadius: BorderRadius.circular(14),
                  borderSide: BorderSide.none,
                ),
                focusedBorder: OutlineInputBorder(
                  borderRadius: BorderRadius.circular(14),
                  borderSide: const BorderSide(color: AC.primary, width: 1.5),
                ),
              ),
              elevatedButtonTheme: ElevatedButtonThemeData(
                style: ElevatedButton.styleFrom(
                  backgroundColor: AC.primary,
                  foregroundColor: AC.white,
                  padding:
                      const EdgeInsets.symmetric(vertical: 16, horizontal: 22),
                  shape: RoundedRectangleBorder(
                      borderRadius: BorderRadius.circular(14)),
                  elevation: 0,
                  textStyle: GoogleFonts.hindSiliguri(
                      fontSize: 15, fontWeight: FontWeight.w600),
                ),
              ),
            );
          }
          ENDX

      - name: Write lib/services.dart
        run: |
          cat > lib/services.dart << 'ENDX'
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_auth/firebase_auth.dart';

          class AdminService {
            static final auth = FirebaseAuth.instance;
            static final db = FirebaseFirestore.instance;

            static const List<String> adminEmails = [
              'admin@jajnet.com',
              'jibonahmmedniloy@gmail.com',
            ];

            static User? get user => auth.currentUser;
            static bool get isAdmin =>
                user != null && adminEmails.contains(user!.email);

            static Future<UserCredential> signIn(
                String email, String password) async {
              final cred = await auth.signInWithEmailAndPassword(
                email: email.trim(),
                password: password,
              );
              if (!adminEmails.contains(cred.user!.email)) {
                await auth.signOut();
                throw 'এই অ্যাকাউন্টটি অ্যাডমিন নয়';
              }
              return cred;
            }

            static Future<void> signOut() => auth.signOut();

            static Stream<QuerySnapshot> get allUsers =>
                db.collection('users').snapshots();

            static Stream<QuerySnapshot> get allPayments => db
                .collection('payments')
                .orderBy('createdAt', descending: true)
                .snapshots();

            static Stream<QuerySnapshot> get pendingPayments => db
                .collection('payments')
                .where('status', isEqualTo: 'pending')
                .snapshots();

            static Stream<QuerySnapshot> get allNotices => db
                .collection('notices')
                .orderBy('createdAt', descending: true)
                .snapshots();

            static Future<void> verifyPayment(String id) async {
              await db.collection('payments').doc(id).update({
                'status': 'verified',
                'verifiedAt': FieldValue.serverTimestamp(),
              });
            }

            static Future<void> rejectPayment(String id) async {
              await db
                  .collection('payments')
                  .doc(id)
                  .update({'status': 'rejected'});
            }

            static Future<void> updateUser(
                String uid, Map<String, dynamic> data) async {
              await db.collection('users').doc(uid).update(data);
            }

            static Future<void> addNotice(String title, String body) async {
              await db.collection('notices').add({
                'title': title,
                'body': body,
                'createdAt': FieldValue.serverTimestamp(),
              });
            }

            static Future<void> deleteNotice(String id) async {
              await db.collection('notices').doc(id).delete();
            }
          }
          ENDX

      - name: Write lib/main.dart
        run: |
          cat > lib/main.dart << 'ENDX'
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/material.dart';

          import 'login.dart';
          import 'shell.dart';
          import 'theme.dart';

          const FirebaseOptions firebaseOptions = FirebaseOptions(
            apiKey: 'AIzaSyAs2g3X7hcN7x99lk1te3vBTlIGhNfryH30',
            appId: '1:862012070477:web:8cee7125b28b5853a51a04',
            messagingSenderId: '862012070477',
            projectId: 'jaj-net',
            authDomain: 'jaj-net.firebaseapp.com',
            storageBucket: 'jaj-net.firebasestorage.app',
          );

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Firebase.initializeApp(options: firebaseOptions);
            runApp(const AdminApp());
          }

          class AdminApp extends StatelessWidget {
            const AdminApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'JAJ Net Admin',
                debugShowCheckedModeBanner: false,
                theme: buildAdminTheme(),
                home: StreamBuilder<User?>(
                  stream: FirebaseAuth.instance.authStateChanges(),
                  builder: (context, snap) {
                    if (snap.connectionState == ConnectionState.waiting) {
                      return const Scaffold(
                        body: Center(child: CircularProgressIndicator()),
                      );
                    }
                    if (snap.hasData) return const AdminShell();
                    return const AdminLogin();
                  },
                ),
              );
            }
          }
          ENDX

      - name: Write lib/login.dart
        run: |
          cat > lib/login.dart << 'ENDX'
          import 'package:flutter/material.dart';
          import 'package:google_fonts/google_fonts.dart';

          import 'services.dart';
          import 'theme.dart';

          class AdminLogin extends StatefulWidget {
            const AdminLogin({super.key});
            @override
            State<AdminLogin> createState() => _AdminLoginState();
          }

          class _AdminLoginState extends State<AdminLogin> {
            final _email = TextEditingController();
            final _pass = TextEditingController();
            bool _loading = false;
            bool _hide = true;

            Future<void> _login() async {
              if (_email.text.isEmpty || _pass.text.isEmpty) return;
              setState(() => _loading = true);
              try {
                await AdminService.signIn(_email.text, _pass.text);
              } catch (e) {
                if (!mounted) return;
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text(e.toString()),
                    behavior: SnackBarBehavior.floating,
                  ),
                );
              } finally {
                if (mounted) setState(() => _loading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: AC.sidebarBg,
                body: Center(
                  child: SingleChildScrollView(
                    padding: const EdgeInsets.all(24),
                    child: Container(
                      width: 420,
                      padding: const EdgeInsets.all(32),
                      decoration: BoxDecoration(
                        color: AC.white,
                        borderRadius: BorderRadius.circular(24),
                        boxShadow: [
                          BoxShadow(
                            color: Colors.black.withOpacity(0.3),
                            blurRadius: 40,
                            offset: const Offset(0, 20),
                          ),
                        ],
                      ),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        crossAxisAlignment: CrossAxisAlignment.stretch,
                        children: [
                          Center(
                            child: Container(
                              width: 80,
                              height: 80,
                              decoration: BoxDecoration(
                                gradient: AC.heroGradient,
                                borderRadius: BorderRadius.circular(24),
                                boxShadow: [
                                  BoxShadow(
                                    color: AC.primary.withOpacity(0.35),
                                    blurRadius: 26,
                                    offset: const Offset(0, 12),
                                  ),
                                ],
                              ),
                              child: const Icon(Icons.wifi_rounded,
                                  size: 44, color: Colors.white),
                            ),
                          ),
                          const SizedBox(height: 22),
                          Center(
                            child: Text(
                              'JAJ Net Admin',
                              style: GoogleFonts.poppins(
                                fontSize: 24,
                                fontWeight: FontWeight.w700,
                                color: AC.ink,
                              ),
                            ),
                          ),
                          const SizedBox(height: 6),
                          Center(
                            child: Text(
                              'শুধুমাত্র অনুমোদিত ব্যবহারকারীর জন্য',
                              style: GoogleFonts.hindSiliguri(
                                fontSize: 12,
                                color: AC.grey,
                              ),
                            ),
                          ),
                          const SizedBox(height: 30),
                          TextField(
                            controller: _email,
                            keyboardType: TextInputType.emailAddress,
                            style: GoogleFonts.hindSiliguri(
                                fontSize: 14, color: AC.ink),
                            decoration: const InputDecoration(
                              labelText: 'অ্যাডমিন ইমেইল',
                              prefixIcon: Icon(Icons.alternate_email_rounded,
                                  color: AC.primary, size: 20),
                            ),
                          ),
                          const SizedBox(height: 14),
                          TextField(
                            controller: _pass,
                            obscureText: _hide,
                            style: GoogleFonts.hindSiliguri(
                                fontSize: 14, color: AC.ink),
                            decoration: InputDecoration(
                              labelText: 'পাসওয়ার্ড',
                              prefixIcon: const Icon(Icons.lock_outline_rounded,
                                  color: AC.primary, size: 20),
                              suffixIcon: IconButton(
                                icon: Icon(
                                  _hide
                                      ? Icons.visibility_outlined
                                      : Icons.visibility_off_outlined,
                                  color: AC.grey,
                                  size: 20,
                                ),
                                onPressed: () => setState(() => _hide = !_hide),
                              ),
                            ),
                          ),
                          const SizedBox(height: 26),
                          SizedBox(
                            height: 54,
                            child: ElevatedButton(
                              onPressed: _loading ? null : _login,
                              child: _loading
