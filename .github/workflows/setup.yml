                                      width: 22,
                                      height: 22,
                                      child: CircularProgressIndicator(
                                          color: Colors.white, strokeWidth: 2.5),
                                    )
                                  : Text(
                                      'লগইন করুন',
                                      style: GoogleFonts.hindSiliguri(
                                        fontSize: 15,
                                        fontWeight: FontWeight.w600,
                                        color: Colors.white,
                                      ),
                                    ),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          ENDX

      - name: Write lib/shell.dart
        run: |
          cat > lib/shell.dart << 'ENDX'
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:flutter/material.dart';
          import 'package:google_fonts/google_fonts.dart';

          import 'pages/customer_detail.dart';
          import 'pages/customers.dart';
          import 'pages/dashboard.dart';
          import 'pages/notices.dart';
          import 'pages/payments.dart';
          import 'services.dart';
          import 'theme.dart';

          class AdminShell extends StatefulWidget {
            const AdminShell({super.key});
            @override
            State<AdminShell> createState() => _AdminShellState();
          }

          class _AdminShellState extends State<AdminShell> {
            int _page = 0;
            final _titles = ['ড্যাশবোর্ড', 'গ্রাহক', 'পেমেন্ট', 'নোটিশ'];

            @override
            Widget build(BuildContext context) {
              final w = MediaQuery.of(context).size.width;
              final isWide = w > 820;

              final pages = [
                const DashboardPage(),
                const CustomersPage(),
                const PaymentsPage(),
                const NoticesPage(),
              ];

              if (isWide) {
                return Scaffold(
                  body: Row(
                    children: [
                      _sidebar(context, isWide: true),
                      Expanded(
                        child: Column(
                          children: [
                            _topBar(context, isWide: true),
                            Expanded(child: pages[_page]),
                          ],
                        ),
                      ),
                    ],
                  ),
                );
              }
              return Scaffold(
                drawer: Drawer(
                  backgroundColor: AC.sidebarBg,
                  child: _sidebar(context, isWide: false),
                ),
                appBar: AppBar(
                  backgroundColor: AC.white,
                  elevation: 0,
                  scrolledUnderElevation: 0,
                  title: Text(_titles[_page],
                      style: GoogleFonts.hindSiliguri(
                          fontSize: 18,
                          fontWeight: FontWeight.w600,
                          color: AC.ink)),
                  iconTheme: const IconThemeData(color: AC.ink),
                ),
                body: pages[_page],
              );
            }

            Widget _topBar(BuildContext context, {required bool isWide}) {
              return Container(
                height: 68,
                decoration: const BoxDecoration(
                  color: AC.white,
                  border: Border(bottom: BorderSide(color: AC.greyLight)),
                ),
                padding: const EdgeInsets.symmetric(horizontal: 24),
                child: Row(
                  children: [
                    Text(_titles[_page],
                        style: GoogleFonts.hindSiliguri(
                            fontSize: 20,
                            fontWeight: FontWeight.w700,
                            color: AC.ink)),
                    const Spacer(),
                    StreamBuilder<QuerySnapshot>(
                      stream: AdminService.pendingPayments,
                      builder: (context, snap) {
                        final n = snap.data?.docs.length ?? 0;
                        if (n == 0) return const SizedBox.shrink();
                        return Container(
                          padding: const EdgeInsets.symmetric(
                              horizontal: 12, vertical: 6),
                          decoration: BoxDecoration(
                            color: AC.error.withOpacity(0.12),
                            borderRadius: BorderRadius.circular(20),
                          ),
                          child: Row(
                            children: [
                              const Icon(Icons.notifications_active,
                                  color: AC.error, size: 16),
                              const SizedBox(width: 6),
                              Text('$n টি পেন্ডিং',
                                  style: GoogleFonts.hindSiliguri(
                                      fontSize: 12,
                                      fontWeight: FontWeight.w600,
                                      color: AC.error)),
                            ],
                          ),
