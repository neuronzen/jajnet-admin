                                        fontWeight: FontWeight.w700,
                                        color: AC.ink)),
                                const SizedBox(height: 18),
                                _f(_name, 'নাম', Icons.person_outline_rounded),
                                const SizedBox(height: 14),
                                _f(_phone, 'ফোন', Icons.phone_outlined),
                                const SizedBox(height: 14),
                                _f(_address, 'ঠিকানা',
                                    Icons.location_on_outlined),
                                const SizedBox(height: 14),
