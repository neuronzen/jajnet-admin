name: Add Customer Creation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch services.dart - add createCustomer
        run: |
          python3 << 'ENDPY'
          with open('lib/services.dart') as f:
              c = f.read()

          # Add firebase_core import if missing
          if "import 'package:firebase_core/firebase_core.dart';" not in c:
              c = c.replace(
                  "import 'package:cloud_firestore/cloud_firestore.dart';",
                  "import 'package:cloud_firestore/cloud_firestore.dart';\nimport 'package:firebase_core/firebase_core.dart';",
              )

          # Add createCustomer method if not present
          if 'createCustomer' not in c:
              new_method = '''
            static Future<String> createCustomer({
              required String name,
              required String phone,
              required String email,
              required String password,
              required String address,
              required String package,
              required int packagePrice,
              required int dueAmount,
              required String status,
            }) async {
              const secondaryName = 'admin_customer_creator';
              FirebaseApp? secondaryApp;
              try {
                try {
                  secondaryApp = Firebase.app(secondaryName);
                } catch (_) {
                  secondaryApp = await Firebase.initializeApp(
                    name: secondaryName,
                    options: Firebase.app().options,
                  );
                }
                final secondaryAuth =
                    FirebaseAuth.instanceFor(app: secondaryApp);
                final cred = await secondaryAuth.createUserWithEmailAndPassword(
                  email: email.trim(),
                  password: password,
                );
                await db.collection('users').doc(cred.user!.uid).set({
                  'name': name,
                  'phone': phone,
                  'email': email,
                  'address': address,
                  'package': package,
                  'packagePrice': packagePrice,
                  'dueAmount': dueAmount,
                  'status': status,
                  'createdAt': FieldValue.serverTimestamp(),
                });
                await secondaryAuth.signOut();
                return cred.user!.uid;
              } finally {
                if (secondaryApp != null) {
                  try {
                    await secondaryApp.delete();
                  } catch (_) {}
                }
              }
            }
          }
          '''
              # Find the closing brace of class (last `}` before final newline)
              idx = c.rstrip().rfind('}')
              if idx > 0:
                  c = c[:idx] + new_method + c[idx+1:]

          with open('lib/services.dart', 'w') as f:
              f.write(c)
          print("services.dart updated")
          ENDPY

      - name: Patch customers.dart - add button and dialog
        run: |
          python3 << 'ENDPY'
          with open('lib/pages/customers.dart') as f:
              c = f.read()

          # Add state variable for dialog
          if '_showAddDialog' not in c:
              c = c.replace(
                  "String _filter = 'all';",
                  "String _filter = 'all';\n\n  void _showAddDialog() {\n    showDialog(\n      context: context,\n      builder: (_) => const _AddCustomerDialog(),\n    );\n  }",
              )

          # Add button in the header row
          old_header = """                        Row(
                          children: [
                            Expanded(
                              child: TextField(
                                onChanged: (v) => setState(() => _search = v),
                                decoration: const InputDecoration(
                                  hintText: 'নাম, ফোন বা ইমেইল দিয়ে খুঁজুন...',
                                  prefixIcon: Icon(Icons.search_rounded,
                                      color: AC.primary, size: 22),
                                ),
                              ),
                            ),
                            const SizedBox(width: 14),
                            _filterChip('সব', 'all'),
                            const SizedBox(width: 8),
                            _filterChip('Active', 'active'),
                            const SizedBox(width: 8),
                            _filterChip('Due', 'due'),
                          ],
                        ),"""

          new_header = """                        Row(
                          children: [
                            Expanded(
                              child: TextField(
                                onChanged: (v) => setState(() => _search = v),
                                decoration: const InputDecoration(
                                  hintText: 'নাম, ফোন বা ইমেইল দিয়ে খুঁজুন...',
                                  prefixIcon: Icon(Icons.search_rounded,
                                      color: AC.primary, size: 22),
                                ),
                              ),
                            ),
                            const SizedBox(width: 14),
                            _filterChip('সব', 'all'),
                            const SizedBox(width: 8),
                            _filterChip('Active', 'active'),
                            const SizedBox(width: 8),
                            _filterChip('Due', 'due'),
                            const SizedBox(width: 14),
                            SizedBox(
                              height: 48,
                              child: ElevatedButton.icon(
                                onPressed: _showAddDialog,
                                icon: const Icon(Icons.person_add_alt_1_rounded,
                                    color: Colors.white, size: 20),
                                label: Text('নতুন গ্রাহক',
                                    style: GoogleFonts.hindSiliguri(
                                        fontSize: 14,
                                        fontWeight: FontWeight.w600)),
                              ),
                            ),
                          ],
                        ),"""

          if old_header in c:
              c = c.replace(old_header, new_header)
              print("Button added")
          else:
              print("Header block not found")

          # Append the dialog widget at the end of file
          if '_AddCustomerDialog' not in c:
              dialog = '''

          class _AddCustomerDialog extends StatefulWidget {
            const _AddCustomerDialog();
            @override
            State<_AddCustomerDialog> createState() => _AddCustomerDialogState();
          }

          class _AddCustomerDialogState extends State<_AddCustomerDialog> {
            final _name = TextEditingController();
            final _phone = TextEditingController();
            final _email = TextEditingController();
            final _pass = TextEditingController(text: 'jajnet1234');
            final _address = TextEditingController();
            String _package = '20 Mbps';
            final _price = TextEditingController(text: '525');
            final _due = TextEditingController(text: '525');
            String _status = 'active';
            bool _loading = false;

            Future<void> _save() async {
              if (_name.text.isEmpty || _email.text.isEmpty || _pass.text.length < 6) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('নাম, ইমেইল এবং ৬+ অক্ষরের পাসওয়ার্ড দিন')),
                );
                return;
              }
              setState(() => _loading = true);
              try {
                await AdminService.createCustomer(
                  name: _name.text.trim(),
                  phone: _phone.text.trim(),
                  email: _email.text.trim(),
                  password: _pass.text,
                  address: _address.text.trim(),
                  package: _package,
                  packagePrice: int.tryParse(_price.text) ?? 0,
                  dueAmount: int.tryParse(_due.text) ?? 0,
                  status: _status,
                );
                if (!mounted) return;
                Navigator.pop(context);
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(
                    content: Text('গ্রাহক যোগ হয়েছে ✅ (পাসওয়ার্ড: ${_pass.text})'),
                    backgroundColor: AC.success,
                    duration: const Duration(seconds: 5),
                    behavior: SnackBarBehavior.floating,
                  ),
                );
              } catch (e) {
                if (!mounted) return;
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text('সমস্যা: ${e.toString()}')),
                );
              } finally {
                if (mounted) setState(() => _loading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return AlertDialog(
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20)),
                title: Row(
                  children: [
                    Container(
                      padding: const EdgeInsets.all(8),
                      decoration: BoxDecoration(
                        gradient: AC.heroGradient,
                        borderRadius: BorderRadius.circular(10),
                      ),
                      child: const Icon(Icons.person_add_alt_1_rounded,
                          color: Colors.white, size: 20),
                    ),
                    const SizedBox(width: 12),
                    Text('নতুন গ্রাহক',
                        style: GoogleFonts.hindSiliguri(
                            fontSize: 18, fontWeight: FontWeight.w700)),
                  ],
                ),
                content: SizedBox(
                  width: 520,
                  child: SingleChildScrollView(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        TextField(
                          controller: _name,
                          style: GoogleFonts.hindSiliguri(fontSize: 14),
                          decoration: const InputDecoration(
                            labelText: 'নাম *',
                            prefixIcon: Icon(Icons.person_outline_rounded,
                                color: AC.primary, size: 20),
                          ),
                        ),
                        const SizedBox(height: 12),
                        TextField(
                          controller: _phone,
                          keyboardType: TextInputType.phone,
                          style: GoogleFonts.hindSiliguri(fontSize: 14),
                          decoration: const InputDecoration(
                            labelText: 'মোবাইল নম্বর',
                            prefixIcon: Icon(Icons.phone_outlined,
                                color: AC.primary, size: 20),
                          ),
                        ),
                        const SizedBox(height: 12),
                        TextField(
                          controller: _email,
                          keyboardType: TextInputType.emailAddress,
                          style: GoogleFonts.hindSiliguri(fontSize: 14),
                          decoration: const InputDecoration(
                            labelText: 'ইমেইল *',
                            prefixIcon: Icon(Icons.alternate_email_rounded,
                                color: AC.primary, size: 20),
                          ),
                        ),
                        const SizedBox(height: 12),
                        TextField(
                          controller: _pass,
                          style: GoogleFonts.hindSiliguri(fontSize: 14),
                          decoration: const InputDecoration(
                            labelText: 'পাসওয়ার্ড * (গ্রাহককে জানাতে হবে)',
                            prefixIcon: Icon(Icons.lock_outline_rounded,
                                color: AC.primary, size: 20),
                          ),
                        ),
                        const SizedBox(height: 12),
                        TextField(
                          controller: _address,
                          style: GoogleFonts.hindSiliguri(fontSize: 14),
                          decoration: const InputDecoration(
                            labelText: 'ঠিকানা',
                            prefixIcon: Icon(Icons.location_on_outlined,
                                color: AC.primary, size: 20),
                          ),
                        ),
                        const SizedBox(height: 12),
                        DropdownButtonFormField<String>(
                          value: _package,
                          decoration: const InputDecoration(
                            labelText: 'প্যাকেজ',
                            prefixIcon: Icon(Icons.wifi_outlined,
                                color: AC.primary, size: 20),
                          ),
                          items: const [
                            DropdownMenuItem(value: '20 Mbps', child: Text('20 Mbps — ৳525')),
                            DropdownMenuItem(value: '30 Mbps', child: Text('30 Mbps — ৳650')),
                            DropdownMenuItem(value: '40 Mbps', child: Text('40 Mbps — ৳750')),
                            DropdownMenuItem(value: '50 Mbps', child: Text('50 Mbps — ৳850')),
                            DropdownMenuItem(value: '70 Mbps', child: Text('70 Mbps — ৳1200')),
                            DropdownMenuItem(value: '100 Mbps', child: Text('100 Mbps — ৳1500')),
                          ],
                          onChanged: (v) {
                            setState(() {
                              _package = v ?? '20 Mbps';
                              final map = {
                                '20 Mbps': 525,
                                '30 Mbps': 650,
                                '40 Mbps': 750,
                                '50 Mbps': 850,
                                '70 Mbps': 1200,
                                '100 Mbps': 1500,
                              };
                              _price.text = (map[_package] ?? 525).toString();
                              _due.text = _price.text;
                            });
                          },
                        ),
                        const SizedBox(height: 12),
                        Row(
                          children: [
                            Expanded(
                              child: TextField(
                                controller: _price,
                                keyboardType: TextInputType.number,
                                style: GoogleFonts.hindSiliguri(fontSize: 14),
                                decoration: const InputDecoration(
                                  labelText: 'মাসিক বিল (৳)',
                                  prefixIcon: Icon(Icons.attach_money_rounded,
                                      color: AC.primary, size: 20),
                                ),
                              ),
                            ),
                            const SizedBox(width: 12),
                            Expanded(
                              child: TextField(
                                controller: _due,
                                keyboardType: TextInputType.number,
                                style: GoogleFonts.hindSiliguri(fontSize: 14),
                                decoration: const InputDecoration(
                                  labelText: 'বর্তমান বকেয়া (৳)',
                                  prefixIcon: Icon(Icons.money_off_rounded,
                                      color: AC.primary, size: 20),
                                ),
                              ),
                            ),
                          ],
                        ),
                        const SizedBox(height: 12),
                        DropdownButtonFormField<String>(
                          value: _status,
                          decoration: const InputDecoration(
                            labelText: 'স্ট্যাটাস',
                            prefixIcon: Icon(Icons.badge_outlined,
                                color: AC.primary, size: 20),
                          ),
                          items: const [
                            DropdownMenuItem(value: 'active', child: Text('Active')),
                            DropdownMenuItem(value: 'due', child: Text('Due')),
                            DropdownMenuItem(value: 'expired', child: Text('Expired')),
                          ],
                          onChanged: (v) => setState(() => _status = v ?? 'active'),
                        ),
                      ],
                    ),
                  ),
                ),
                actions: [
                  TextButton(
                    onPressed: _loading ? null : () => Navigator.pop(context),
                    child: Text('বাতিল',
                        style: GoogleFonts.hindSiliguri(color: AC.grey)),
                  ),
                  ElevatedButton(
                    onPressed: _loading ? null : _save,
                    child: _loading
                        ? const SizedBox(
                            width: 18,
                            height: 18,
                            child: CircularProgressIndicator(
                                color: Colors.white, strokeWidth: 2))
                        : Text('যোগ করুন',
                            style: GoogleFonts.hindSiliguri(
                                fontWeight: FontWeight.w600)),
                  ),
                ],
              );
            }
          }
          '''
              c = c + dialog

          with open('lib/pages/customers.dart', 'w') as f:
              f.write(c)
          print("customers.dart updated")
          ENDPY

      - name: Commit and push
        run: |
          git config user.name "JAJ Net Bot"
          git config user.email "bot@jajnet.local"
          git add .
          git commit -m "Add customer creation to admin panel" || echo "nothing to commit"
          git push
