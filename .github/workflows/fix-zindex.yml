name: Fix Sidebar Z-Index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch CSS z-index
        run: |
          python3 << 'ENDPY'
          with open('docs/style.css') as f:
              c = f.read()

          # Sidebar above overlay
          c = c.replace(
              "z-index:50;\n            transition:transform .25s;overflow-y:auto;",
              "z-index:100;\n            transition:transform .25s;overflow-y:auto;"
          )
          # Overlay below sidebar
          c = c.replace(
              ".overlay{position:fixed;inset:0;background:rgba(21,26,38,.55);z-index:80}",
              ".overlay{position:fixed;inset:0;background:rgba(21,26,38,.55);z-index:90}"
          )
          # Modal above all
          c = c.replace(
              ".modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px}",
              ".modal{position:fixed;inset:0;z-index:110;display:grid;place-items:center;padding:20px}"
          )
          # Toast above everything
          c = c.replace(
              "box-shadow:0 12px 30px rgba(0,0,0,.35);z-index:100;",
              "box-shadow:0 12px 30px rgba(0,0,0,.35);z-index:120;"
          )

          # Add close button styles if not present
          if '.sidebar-close' not in c:
              c += """
          .sidebar-close{
            display:none;position:absolute;top:14px;right:14px;
            width:34px;height:34px;border-radius:10px;
            background:rgba(255,255,255,.1);color:#fff;font-size:18px;
            align-items:center;justify-content:center;
          }
          @media(max-width:768px){
            .sidebar-close{display:flex}
          }
          """

          with open('docs/style.css','w') as f:
              f.write(c)
          print("CSS updated")
          ENDPY
          grep -n "z-index" docs/style.css

      - name: Patch HTML - add close button
        run: |
          python3 << 'ENDPY'
          with open('docs/index.html') as f:
              c = f.read()

          # Insert close button inside sidebar, right after opening <aside>
          if 'sidebar-close' not in c:
              c = c.replace(
                  '<aside id="sidebar" class="sidebar">',
                  '<aside id="sidebar" class="sidebar">\n              <button id="sidebarClose" class="sidebar-close" aria-label="close">&#10005;</button>'
              )

          with open('docs/index.html','w') as f:
              f.write(c)
          print("HTML updated")
          ENDPY
          grep -n "sidebar-close\|sidebarClose" docs/index.html

      - name: Patch JS - wire close button + toggle
        run: |
          python3 << 'ENDPY'
          with open('docs/app.js') as f:
              c = f.read()

          old = """          function openSidebar(){$('#sidebar').classList.add('open');$('#overlay').classList.remove('hidden')}
          function closeSidebar(){$('#sidebar').classList.remove('open');$('#overlay').classList.add('hidden')}
          $('#menuBtn').onclick=openSidebar;
          $('#overlay').onclick=()=>{closeSidebar();closeModal()};"""

          new = """          function openSidebar(){$('#sidebar').classList.add('open');$('#overlay').classList.remove('hidden')}
          function closeSidebar(){$('#sidebar').classList.remove('open');$('#overlay').classList.add('hidden')}
          function toggleSidebar(){
            if($('#sidebar').classList.contains('open'))closeSidebar();
            else openSidebar();
          }
          $('#menuBtn').onclick=toggleSidebar;
          const sbClose=document.getElementById('sidebarClose');
          if(sbClose)sbClose.onclick=closeSidebar;
          $('#overlay').onclick=()=>{closeSidebar();closeModal()};"""

          if old in c:
              c = c.replace(old, new)
              print("JS toggle patched")
          else:
              print("JS pattern not found - manual patch needed")

          with open('docs/app.js','w') as f:
              f.write(c)
          ENDPY
          grep -n "sidebarClose\|toggleSidebar" docs/app.js

      - name: Commit
        run: |
          git config user.name "JAJ Net Bot"
          git config user.email "bot@jajnet.local"
          git add docs/
          git commit -m "Fix: sidebar z-index above overlay + add mobile close button" || echo "no change"
          git push
