name: Force Add Customer Feature

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backup and verify
        run: |
          echo "=== BEFORE ==="
          grep -c "নতুন গ্রাহক" lib/pages/customers.dart || echo "0 found"
          grep -c "createCustomer" lib/services.dart || echo "0 found"

      - name: Write lib/services.dart
        run: |
          cat > lib/services.dart << 'ENDSV'
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:firebase_core/firebase_core.dart';

          class AdminService {
            static final auth = FirebaseAuth.instance;
            static final db = FirebaseFirestore.instance;

            static const List<String> adminEmails = [
              'admin@jajnet.com',
              'jibonahmmedniloy@gmail.com',
            ];

            static User? get user => auth.currentUser;
            static bool get isAdmin =>
                user != null && adminEmails.contains(user!.email);

            static Future<UserCredential> signIn(
                String email, String password) async {
              final cred = await auth.signInWithEmailAndPassword(
                email: email.trim(),
                password: password,
              );
              if (!adminEmails.contains(cred.user!.email)) {
                await auth.signOut();
                throw 'এই অ্যাকাউন্টটি অ্যাডমিন নয়';
              }
              return cred;
            }

            static Future<void> signOut() => auth.signOut();

            static Stream<QuerySnapshot> get allUsers =>
                db.collection('users').snapshots();

            static Stream<QuerySnapshot> get allPayments => db
                .collection('payments')
                .orderBy('createdAt', descending: true)
                .snapshots();

            static Stream<QuerySnapshot> get pendingPayments => db
                .collection('payments')
                .where('status', isEqualTo: 'pending')
                .snapshots();

            static Stream<QuerySnapshot> get allNotices => db
                .collection('notices')
                .orderBy('createdAt', descending: true)
                .snapshots();

            static Future<void> verifyPayment(String id) async {
              await db.collection('payments').doc(id).update({
                'status': 'verified',
                'verifiedAt': FieldValue.serverTimestamp(),
              });
            }

            static Future<void> rejectPayment(String id) async {
              await db
                  .collection('payments')
                  .doc(id)
                  .update({'status': 'rejected'});
            }

            static Future<void> updateUser(
                String uid, Map<String, dynamic> data) async {
              await db.collection('users').doc(uid).update(data);
            }

            static Future<void> addNotice(String title, String body) async {
              await db.collection('notices').add({
                'title': title,
                'body': body,
                'createdAt': FieldValue.serverTimestamp(),
              });
            }

            static Future<void> deleteNotice(String id) async {
              await db.collection('notices').doc(id).delete();
            }

            static Future<String> createCustomer({
              required String name,
              required String phone,
              required String email,
              required String password,
              required String address,
              required String package,
              required int packagePrice,
              required int dueAmount,
              required String status,
            }) async {
              const secondaryName = 'admin_creator';
              FirebaseApp? secondaryApp;
              try {
                try {
                  secondaryApp = Firebase.app(secondaryName);
                } catch (_) {
                  secondaryApp = await Firebase.initializeApp(
                    name: secondaryName,
                    options: Firebase.app().options,
                  );
                }
                final secondaryAuth =
                    FirebaseAuth.instanceFor(app: secondaryApp);
                final cred = await secondaryAuth.createUserWithEmailAndPassword(
                  email: email.trim(),
                  password: password,
                );
                await db.collection('users').doc(cred.user!.uid).set({
                  'name': name,
                  'phone': phone,
                  'email': email,
                  'address': address,
                  'package': package,
                  'packagePrice': packagePrice,
                  'dueAmount': dueAmount,
                  'status': status,
                  'createdAt': FieldValue.serverTimestamp(),
                });
                await secondaryAuth.signOut();
                return cred.user!.uid;
              } finally {
                if (secondaryApp != null) {
                  try {
                    await secondaryApp.delete();
                  } catch (_) {}
                }
              }
            }
          }
          ENDSV
          sed -i 's/^          //' lib/services.dart

      - name: Verify services
        run: |
          echo "=== AFTER ==="
          grep -c "createCustomer" lib/services.dart

      - name: Commit
        run: |
          git config user.name "JAJ Net Bot"
          git config user.email "bot@jajnet.local"
          git add .
          git commit -m "Force rewrite services.dart with createCustomer" || echo "no change"
          git push
