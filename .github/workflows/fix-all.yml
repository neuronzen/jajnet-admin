name: Fix All Issues

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write lib/pages/dashboard.dart
        run: |
          cat > lib/pages/dashboard.dart << 'ENDDASH'
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:flutter/material.dart';
          import 'package:google_fonts/google_fonts.dart';
          import 'package:intl/intl.dart';

          import '../services.dart';
          import '../theme.dart';

          class DashboardPage extends StatelessWidget {
            const DashboardPage({super.key});

            @override
            Widget build(BuildContext context) {
              return StreamBuilder<QuerySnapshot>(
                stream: AdminService.allUsers,
                builder: (context, usersSnap) {
                  return StreamBuilder<QuerySnapshot>(
                    stream: AdminService.allPayments,
                    builder: (context, paySnap) {
                      final users = usersSnap.data?.docs ?? [];
                      final payments = paySnap.data?.docs ?? [];

                      int active = 0, due = 0, expired = 0;
                      double dueAmount = 0;
                      for (final d in users) {
                        final m = d.data() as Map<String, dynamic>;
                        final s = (m['status'] ?? '').toString();
                        if (s == 'active') active++;
                        if (s == 'due') due++;
                        if (s == 'expired') expired++;
                        dueAmount += ((m['dueAmount'] ?? 0) as num).toDouble();
                      }

                      int pending = 0;
                      double todayCollection = 0;
                      final today = DateTime.now();
                      for (final d in payments) {
                        final m = d.data() as Map<String, dynamic>;
                        if (m['status'] == 'pending') pending++;
                        if (m['status'] == 'verified' && m['verifiedAt'] != null) {
                          final ts = m['verifiedAt'];
                          if (ts is Timestamp) {
                            final dt = ts.toDate();
                            if (dt.year == today.year &&
                                dt.month == today.month &&
                                dt.day == today.day) {
                              todayCollection +=
                                  ((m['amount'] ?? 0) as num).toDouble();
                            }
                          }
                        }
                      }

                      final recent = users.take(5).toList();

                      return SingleChildScrollView(
                        padding: const EdgeInsets.all(18),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            _welcomeCard(),
                            const SizedBox(height: 20),
                            Text('ব্যবসার সারসংক্ষেপ',
                                style: GoogleFonts.hindSiliguri(
                                    fontSize: 15,
                                    fontWeight: FontWeight.w700,
                                    color: AC.ink)),
                            const SizedBox(height: 10),
                            _statGrid([
                              _stat('মোট গ্রাহক', '${users.length}',
                                  Icons.people_alt_rounded, AC.info),
                              _stat('Active', '$active',
                                  Icons.check_circle_rounded, AC.success),
                              _stat('Due', '$due',
                                  Icons.warning_amber_rounded, AC.warning),
                              _stat('Expired', '$expired',
                                  Icons.cancel_rounded, AC.error),
                              _stat('পেন্ডিং', '$pending',
                                  Icons.pending_actions_rounded, AC.warning),
                              _stat('বকেয়া',
                                  '৳${dueAmount.toStringAsFixed(0)}',
                                  Icons.account_balance_wallet_rounded,
                                  AC.error),
                            ]),
                            const SizedBox(height: 20),
                            _todayCard(todayCollection),
                            const SizedBox(height: 22),
                            Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: [
                                Text('সাম্প্রতিক গ্রাহক',
                                    style: GoogleFonts.hindSiliguri(
                                        fontSize: 15,
                                        fontWeight: FontWeight.w700,
                                        color: AC.ink)),
                                Text('${users.length} জন',
                                    style: GoogleFonts.hindSiliguri(
                                        fontSize: 12, color: AC.grey)),
                              ],
                            ),
                            const SizedBox(height: 10),
                            _recentList(recent),
                            const SizedBox(height: 30),
                          ],
                        ),
                      );
                    },
                  );
                },
              );
            }

            Widget _welcomeCard() {
              return Container(
                width: double.infinity,
                padding: const EdgeInsets.all(20),
                decoration: BoxDecoration(
                  gradient: AC.heroGradient,
                  borderRadius: BorderRadius.circular(20),
                  boxShadow: [
                    BoxShadow(
                      color: AC.primary.withOpacity(0.25),
                      blurRadius: 20,
                      offset: const Offset(0, 10),
                    ),
                  ],
                ),
                child: Row(
                  children: [
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text('স্বাগতম 👋',
                              style: GoogleFonts.hindSiliguri(
                                  fontSize: 20,
                                  fontWeight: FontWeight.w700,
                                  color: Colors.white)),
                          const SizedBox(height: 4),
                          Text('JAJ Net ব্যবসার সারসংক্ষেপ',
                              style: GoogleFonts.hindSiliguri(
                                  fontSize: 12,
                                  color: Colors.white.withOpacity(0.92))),
                          const SizedBox(height: 10),
                          Text(
                              DateFormat('dd MMM yyyy, EEEE')
                                  .format(DateTime.now()),
                              style: GoogleFonts.poppins(
                                  fontSize: 11,
                                  color: Colors.white.withOpacity(0.88))),
                        ],
                      ),
                    ),
                    Container(
                      width: 54,
                      height: 54,
                      decoration: BoxDecoration(
                        color: Colors.white.withOpacity(0.22),
                        borderRadius: BorderRadius.circular(16),
                      ),
                      child: const Icon(Icons.wifi_rounded,
                          color: Colors.white, size: 28),
                    ),
                  ],
                ),
              );
            }

            Widget _todayCard(double amount) {
              return Container(
                width: double.infinity,
                padding: const EdgeInsets.symmetric(
                    horizontal: 20, vertical: 16),
                decoration: BoxDecoration(
                  gradient: AC.heroGradient,
                  borderRadius: BorderRadius.circular(16),
                  boxShadow: [
                    BoxShadow(
                      color: AC.primary.withOpacity(0.25),
                      blurRadius: 18,
                      offset: const Offset(0, 8),
                    ),
                  ],
                ),
                child: Row(
                  children: [
                    Container(
                      width: 46,
                      height: 46,
                      decoration: BoxDecoration(
                        color: Colors.white.withOpacity(0.22),
                        borderRadius: BorderRadius.circular(12),
                      ),
                      child: const Icon(Icons.today_rounded,
                          color: Colors.white, size: 24),
                    ),
                    const SizedBox(width: 14),
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text('আজকের আদায়',
                              style: GoogleFonts.hindSiliguri(
                                  fontSize: 12,
                                  color: Colors.white.withOpacity(0.92))),
                          const SizedBox(height: 2),
                          Text('৳${amount.toStringAsFixed(0)}',
                              style: GoogleFonts.poppins(
                                  fontSize: 22,
                                  fontWeight: FontWeight.w700,
                                  color: Colors.white)),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _recentList(List<QueryDocumentSnapshot> recent) {
              return Container(
                padding: const EdgeInsets.all(14),
                decoration: BoxDecoration(
                  color: AC.white,
                  borderRadius: BorderRadius.circular(16),
                  boxShadow: AC.cardShadow,
                ),
                child: recent.isEmpty
                    ? Padding(
                        padding: const EdgeInsets.all(20),
                        child: Center(
                          child: Text('কোনো গ্রাহক নেই',
                              style: GoogleFonts.hindSiliguri(
                                  color: AC.grey)),
                        ),
                      )
                    : Column(
                        children: recent.map((d) {
                          final m = d.data() as Map<String, dynamic>;
                          final s = (m['status'] ?? '').toString();
                          final color = s == 'active'
                              ? AC.success
                              : s == 'due'
                                  ? AC.warning
                                  : AC.error;
                          return Padding(
                            padding:
                                const EdgeInsets.symmetric(vertical: 6),
                            child: Row(
                              children: [
                                CircleAvatar(
                                  radius: 18,
                                  backgroundColor:
                                      AC.primary.withOpacity(0.15),
                                  child: Text(
                                    (m['name'] ?? 'U')
                                        .toString()
                                        .substring(0, 1)
                                        .toUpperCase(),
                                    style: GoogleFonts.poppins(
                                        fontSize: 14,
                                        fontWeight: FontWeight.w700,
                                        color: AC.primary),
                                  ),
                                ),
                                const SizedBox(width: 10),
                                Expanded(
                                  child: Column(
                                    crossAxisAlignment:
                                        CrossAxisAlignment.start,
                                    children: [
                                      Text(m['name'] ?? '',
                                          style: GoogleFonts.hindSiliguri(
                                              fontSize: 14,
                                              fontWeight: FontWeight.w600,
                                              color: AC.ink)),
                                      Text(
                                          '${m['package'] ?? ''} • ৳${m['packagePrice'] ?? 0}',
                                          style: GoogleFonts.hindSiliguri(
                                              fontSize: 11,
                                              color: AC.grey)),
                                    ],
                                  ),
                                ),
                                Container(
                                  padding: const EdgeInsets.symmetric(
                                      horizontal: 8, vertical: 3),
                                  decoration: BoxDecoration(
                                    color: color.withOpacity(0.12),
                                    borderRadius: BorderRadius.circular(20),
                                  ),
                                  child: Text(s.toUpperCase(),
                                      style: GoogleFonts.poppins(
                                          fontSize: 9,
                                          fontWeight: FontWeight.w600,
                                          color: color)),
                                ),
                              ],
                            ),
                          );
                        }).toList(),
                      ),
              );
            }

            Widget _statGrid(List<_StatData> items) {
              return LayoutBuilder(builder: (context, c) {
                final cols = c.maxWidth > 900
                    ? 3
                    : c.maxWidth > 480
                        ? 2
                        : 2;
                final spacing = 10.0;
                final totalSpacing = spacing * (cols - 1);
                final itemWidth = (c.maxWidth - totalSpacing) / cols;
                return Wrap(
                  spacing: spacing,
                  runSpacing: spacing,
                  children: items.map((s) {
                    return SizedBox(
                      width: itemWidth,
                      height: 72,
                      child: _statCard(s),
                    );
                  }).toList(),
                );
              });
            }

            _StatData _stat(
                String label, String value, IconData icon, Color color) {
              return _StatData(
                  label: label, value: value, icon: icon, color: color);
            }

            Widget _statCard(_StatData s) {
              return Container(
                padding: const EdgeInsets.symmetric(
                    horizontal: 12, vertical: 10),
                decoration: BoxDecoration(
                  color: AC.white,
                  borderRadius: BorderRadius.circular(14),
                  boxShadow: AC.cardShadow,
                ),
                child: Row(
                  children: [
                    Container(
                      width: 38,
                      height: 38,
                      decoration: BoxDecoration(
                        color: s.color.withOpacity(0.12),
                        borderRadius: BorderRadius.circular(10),
                      ),
                      child: Icon(s.icon, color: s.color, size: 20),
                    ),
                    const SizedBox(width: 10),
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          Text(s.label,
                              style: GoogleFonts.hindSiliguri(
                                  fontSize: 11, color: AC.grey),
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis),
                          const SizedBox(height: 1),
                          Text(s.value,
                              style: GoogleFonts.poppins(
                                  fontSize: 17,
                                  fontWeight: FontWeight.w700,
                                  color: AC.ink),
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class _StatData {
            final String label;
            final String value;
            final IconData icon;
            final Color color;
            const _StatData({
              required this.label,
              required this.value,
              required this.icon,
              required this.color,
            });
          }
          ENDDASH
          sed -i 's/^          //' lib/pages/dashboard.dart

      - name: Write deploy.yml with html renderer
        run: |
          cat > .github/workflows/deploy.yml << 'ENDDEP'
          name: Deploy Admin Panel

          on:
            push:
              branches: [ main ]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: false

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4

                - name: Setup Flutter
                  uses: subosito/flutter-action@v2
                  with:
                    flutter-version: '3.24.0'
                    channel: 'stable'
                    cache: true

                - name: Enable web
                  run: flutter config --enable-web

                - name: Flutter pub get
                  run: flutter pub get

                - name: Build Web (HTML renderer)
                  run: flutter build web --release --base-href /jajnet-admin/ --web-renderer html

                - name: Upload Pages Artifact
                  uses: actions/upload-pages-artifact@v3
                  with:
                    path: build/web

            deploy:
              needs: build
              runs-on: ubuntu-latest
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              steps:
                - name: Deploy to GitHub Pages
                  id: deployment
                  uses: actions/deploy-pages@v4
          ENDDEP
          sed -i 's/^          //' .github/workflows/deploy.yml

      - name: Commit
        run: |
          git config user.name "JAJ Net Bot"
          git config user.email "bot@jajnet.local"
          git add .
          git commit -m "Fix dashboard layout + switch to HTML renderer for better mobile compatibility" || echo "no change"
          git push
