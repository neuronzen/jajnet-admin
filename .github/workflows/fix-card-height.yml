name: Fix Card Height

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch dashboard aspect ratio
        run: |
          python3 << 'ENDPY'
          with open('lib/pages/dashboard.dart') as f:
              c = f.read()

          old = """                              return GridView.count(
                                crossAxisCount: cols,
                                crossAxisSpacing: 12,
                                mainAxisSpacing: 12,
                                childAspectRatio:
                                    cols == 1 ? 3.2 : (cols == 2 ? 2.4 : 2.8),
                                shrinkWrap: true,
                                physics:
                                    const NeverScrollableScrollPhysics(),
                                children: ["""

          new = """                              return GridView.count(
                                crossAxisCount: cols,
                                crossAxisSpacing: 12,
                                mainAxisSpacing: 12,
                                childAspectRatio:
                                    cols == 1 ? 5.2 : (cols == 2 ? 3.6 : 4.2),
                                shrinkWrap: true,
                                physics:
                                    const NeverScrollableScrollPhysics(),
                                children: ["""

          if old in c:
              c = c.replace(old, new)
              print("Aspect ratio updated")
          else:
              print("Pattern not found - trying alternative")

          with open('lib/pages/dashboard.dart', 'w') as f:
              f.write(c)
          ENDPY

      - name: Verify
        run: |
          grep -n "childAspectRatio" lib/pages/dashboard.dart

      - name: Commit
        run: |
          git config user.name "JAJ Net Bot"
          git config user.email "bot@jajnet.local"
          git add .
          git commit -m "Reduce dashboard card height for mobile" || echo "no change"
          git push
