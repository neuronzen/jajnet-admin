name: Fix JS Sidebar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite sidebar section in app.js
        run: |
          python3 << 'ENDPY'
          with open('docs/app.js') as f:
              c = f.read()

          # Find the sidebar section and replace it entirely
          start_marker = "// ============ SIDEBAR ============"
          end_marker = "// ============ ROUTER ============"

          start = c.find(start_marker)
          end = c.find(end_marker)

          if start == -1 or end == -1:
              print("Markers not found!")
              exit(1)

          new_section = """// ============ SIDEBAR ============
          function openSidebar(){
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('overlay').classList.remove('hidden');
          }
          function closeSidebar(){
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.add('hidden');
          }
          function toggleSidebar(){
            var sb = document.getElementById('sidebar');
            if(sb.classList.contains('open'))closeSidebar();
            else openSidebar();
          }
          (function(){
            var mb = document.getElementById('menuBtn');
            if(mb) mb.onclick = toggleSidebar;
            var sc = document.getElementById('sidebarClose');
            if(sc) sc.onclick = closeSidebar;
            var ov = document.getElementById('overlay');
            if(ov) ov.onclick = function(){ closeSidebar(); closeModal(); };
          })();

          """

          # Dedent the new section (remove leading spaces from YAML heredoc)
          lines = new_section.split('\n')
          cleaned = []
          for line in lines:
              if line.startswith('          '):
                  cleaned.append(line[10:])
              else:
                  cleaned.append(line)
          new_section = '\n'.join(cleaned)

          result = c[:start] + new_section + c[end:]
          with open('docs/app.js','w') as f:
              f.write(result)
          print("Sidebar section rewritten")
          ENDPY

      - name: Verify
        run: |
          grep -n "toggleSidebar\|sidebarClose\|menuBtn" docs/app.js

      - name: Commit and push
        run: |
          git config user.name "JAJ Net Bot"
          git config user.email "bot@jajnet.local"
          git add docs/
          git commit -m "Fix sidebar toggle with z-index + close button" || echo "no change"
          git push
